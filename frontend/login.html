<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — AI UniPod Lagos</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="images/unipods Logo.png">
  <link rel="apple touch icon" href="images/unipods Logo.png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, var(--near-black) 0%, var(--unipods-deep-blue) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-body);
    }
    .login-container {
      background: white;
      border-radius: 8px;
      padding: 48px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo img {
      height: 60px;
      margin-bottom: 16px;
    }
    .login-logo h1 {
      font-family: var(--font-ui);
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .login-logo p {
      font-size: 0.85rem;
      color: var(--gray);
    }
    .alert {
      padding: 12px 16px;
      border-radius: 4px;
      margin-bottom: 24px;
      font-size: 0.9rem;
    }
    .alert-error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .alert-success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-logo">
      <img src="https://res.cloudinary.com/dxeddg9wf/image/upload/f_auto,q_auto/unipod/unipods%20Logo.png" alt="UniPod Lagos">
      <h1>Admin Panel</h1>
      <p>AI UniPod Lagos CMS</p>
    </div>
    
    <div id="alertBox" style="display:none;"></div>
    
    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn--primary w-full" id="loginBtn">
        Sign In
      </button>
    </form>
    
    <div style="margin-top: 24px; text-align: center;">
      <a href="index.html" style="font-size: 0.85rem; color: var(--gray);">← Back to Website</a>
    </div>
  </div>

  <script type="module">
    import { initAuth, signIn } from './js/auth.js';
    
    // Initialize auth
    initAuth();
    
    // Check if already logged in
    const session = sessionStorage.getItem('admin_session');
    if (session) {
      window.location.href = 'admin.html';
    }
    
    // Handle login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const alertBox = document.getElementById('alertBox');
      
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      alertBox.style.display = 'none';
      
      try {
        await signIn(email, password);
        alertBox.className = 'alert alert-success';
        alertBox.textContent = 'Login successful! Redirecting...';
        alertBox.style.display = 'block';
        
        setTimeout(() => {
          window.location.href = 'admin.html';
        }, 1000);
      } catch (error) {
        alertBox.className = 'alert alert-error';
        alertBox.textContent = error.message || 'Invalid credentials. Please try again.';
        alertBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
