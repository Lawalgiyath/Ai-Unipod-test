# Netlify Configuration for AI UniPod Lagos

[build]
  publish = "frontend"
  functions = "netlify/functions"

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.supabase.co https://unilag.edu.ng; frame-ancestors 'none';"

# Admin panel protection
[[redirects]]
  from = "/admin.html"
  to = "/login.html"
  status = 302
  conditions = {Cookie = ["!admin_session"]}

# API proxy for Supabase (hides credentials)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/supabase-proxy/:splat"
  status = 200

# Environment variables (set these in Netlify dashboard)
[context.production.environment]
  NODE_ENV = "production"

# Rate limiting plugin
[[plugins]]
  package = "@netlify/plugin-lighthouse"

# Form handling (if needed)
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true
